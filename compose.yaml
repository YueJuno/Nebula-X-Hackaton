# Development only: source folders are mounted for automatic reload.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --reload-dir
      - /app/scheduler

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
    command: ["python", "-m", "app.workers.dev"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    environment:
      # Browser requests use the published backend port, not a Docker hostname.
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      # Keep Linux dependencies separate from host node_modules.
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
